<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Buku Induk - SMP THHK</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af', // Deep Blue
                        secondary: '#3b82f6', // Light Blue
                        accent: '#f59e0b', // Amber
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            color: #333;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #ffffff;
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- TOAST -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300">
        <div id="toast-content" class="px-6 py-3 rounded-xl shadow-2xl font-medium text-sm text-white flex items-center gap-3">
            <span id="toast-icon"><i class="fas fa-info-circle"></i></span>
            <span id="toast-message">Notifikasi</span>
        </div>
    </div>

    <!-- LOGIN PANEL -->
    <div class="glass-card w-full max-w-md rounded-2xl p-8 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-secondary opacity-10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary opacity-10 rounded-full blur-2xl"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-20 h-20 bg-primary text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg transform rotate-3">
                <i class="fas fa-book-open text-3xl transform -rotate-3"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Buku Induk Digital</h1>
            <p class="text-sm text-gray-500 mt-1">Sistem Informasi Manajemen Siswa<br>SMP Tunas Hidup Harapan Kita</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username / ID Pegawai</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" id="username" required placeholder="Masukkan username" class="input-field pl-10">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="input-field pl-10">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform transition active:scale-95 flex justify-center items-center gap-2 mt-4">
                <span id="login-text">Masuk ke Sistem</span>
                <div id="login-loader" class="spinner hidden"></div>
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-gray-400 border-t border-gray-100 pt-4 relative z-10">
            &copy; 2026 Hak Cipta Dilindungi<br>Kurikulum SMP THHK
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // 1. SETUP SUPABASE
        // ==========================================
        // Gunakan kredensial yang sama (atau ganti jika Anda membuat project baru di Supabase)
        const SUPABASE_URL = 'https://jbmhfwfckmneivztsizc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lkdD9wXKswBi-r0PegxHhQ_6QTnitLL'; // Anda perlu mengganti ini dengan key asli Anda
        
        var supabaseClient;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            showToast("Gagal memuat library sistem.", "error");
        }

        // ==========================================
        // 2. UTILITIES
        // ==========================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toast-content');
            const msg = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            
            msg.innerText = message;
            
            content.className = 'px-6 py-3 rounded-xl shadow-2xl font-medium text-sm text-white flex items-center gap-3';
            if (type === 'success') {
                content.classList.add('bg-green-600');
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else if (type === 'error') {
                content.classList.add('bg-red-600');
                icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
            } else {
                content.classList.add('bg-blue-600');
                icon.innerHTML = '<i class="fas fa-info-circle"></i>';
            }

            toast.classList.remove('hidden');
            toast.style.top = '1.25rem';
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function toggleLoading(isLoading) {
            const btn = document.getElementById('btn-login');
            const text = document.getElementById('login-text');
            const loader = document.getElementById('login-loader');
            
            btn.disabled = isLoading;
            if (isLoading) {
                text.innerText = "Mengautentikasi...";
                loader.classList.remove('hidden');
                btn.classList.add('opacity-80', 'cursor-wait');
            } else {
                text.innerText = "Masuk ke Sistem";
                loader.classList.add('hidden');
                btn.classList.remove('opacity-80', 'cursor-wait');
            }
        }

        // Cek sesi otomatis
        function checkSession() {
            const session = localStorage.getItem('bi_session');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.role === 'Admin') {
                        window.location.href = 'admin.html';
                    } else if (data.role === 'Guru') {
                        window.location.href = 'guru.html';
                    }
                } catch (e) {
                    localStorage.removeItem('bi_session');
                }
            }
        }
        checkSession();

        // ==========================================
        // 3. LOGIN LOGIC
        // ==========================================
        async function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (!user || !pass) {
                showToast("Mohon lengkapi data", "error");
                return;
            }

            toggleLoading(true);

            try {
                // Untuk tahap development, buat bypass sementara jika database belum diisi data guru/admin
                if (user === 'admin' && pass === 'admin123') {
                    const fakeSession = { id: 'dev-admin', nama: 'Administrator', role: 'Admin' };
                    localStorage.setItem('bi_session', JSON.stringify(fakeSession));
                    showToast("Login Berhasil (Dev Mode)", "success");
                    setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
                    return;
                }
                
                if (user === 'guru' && pass === 'guru123') {
                    const fakeSession = { id: 'dev-guru', nama: 'Bapak/Ibu Guru', role: 'Guru' };
                    localStorage.setItem('bi_session', JSON.stringify(fakeSession));
                    showToast("Login Berhasil (Dev Mode)", "success");
                    setTimeout(() => { window.location.href = 'guru.html'; }, 1000);
                    return;
                }

                // Jika sudah ada RPC di Supabase:
                const { data, error } = await supabaseClient.rpc('login_staff', {
                    p_username: user,
                    p_password: pass
                });

                if (error) throw error;

                // Simpan Sesi
                localStorage.setItem('bi_session', JSON.stringify(data));
                showToast(`Selamat datang, ${data.nama}`, "success");
                
                setTimeout(() => {
                    if (data.role === 'Admin') window.location.href = 'admin.html';
                    else window.location.href = 'guru.html';
                }, 1000);

            } catch (err) {
                showToast(err.message || "Username/Password salah", "error");
            } finally {
                toggleLoading(false);
            }
        }
    </script>
</body>
</html>

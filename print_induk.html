<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Lembar Buku Induk</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        /* Base styles for formal document */
        body {
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            background: #e5e7eb;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .a4-container {
            background: #fff;
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            position: relative;
            margin-bottom: 20px;
            page-break-after: always;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 4px double #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .header-logo {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-text {
            text-align: center;
            flex-grow: 1;
        }

        .header-text h1 {
            font-size: 16pt;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-text h2 {
            font-size: 22pt;
            margin: 0;
            font-weight: 800;
        }

        .header-text h3 {
            font-size: 12pt;
            margin: 2px 0;
            font-weight: bold;
        }

        .header-text p {
            font-size: 10pt;
            margin: 0;
            line-height: 1.2;
        }

        .title {
            text-align: center;
            font-size: 16pt;
            font-weight: bold;
            margin: 20px 0;
            text-decoration: underline;
            text-transform: uppercase;
        }

        /* Layout with Photo */
        .top-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .photo-box {
            width: 30mm;
            height: 40mm;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 9pt;
            color: #666;
            background-color: #f9f9f9;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* hidden if no photo */
        }

        .table-data {
            width: 100%;
            border-collapse: collapse;
            font-size: 11pt;
            margin-bottom: 20px;
        }

        .table-data td {
            padding: 4px 0;
            vertical-align: top;
        }

        .table-data td.label {
            width: 35%;
        }

        .table-data td.colon {
            width: 2%;
            text-align: center;
        }

        .table-data td.value {
            width: 63%;
            font-weight: bold;
        }

        .section-title {
            font-weight: bold;
            font-size: 12pt;
            margin-top: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
            border-bottom: 1px solid #000;
        }

        /* Signatures */
        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            page-break-inside: avoid;
        }

        .sign-box {
            width: 200px;
            text-align: center;
            font-size: 11pt;
        }

        .sign-space {
            height: 80px;
        }

        /* Loading Overlay */
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 20px;
            z-index: 1000;
        }

        /* Print Settings */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .a4-container {
                box-shadow: none;
                width: 100%;
                min-height: auto;
                padding: 10mm;
            }
            .no-print {
                display: none !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">Memuat Data Siswa...</div>

    <div id="main-container"></div>

    <!-- Floating Print Buttons (Hidden during printing) -->
    <div class="no-print" style="position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px;">
        <button onclick="window.close()" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #ccc; background: white; cursor: pointer; font-family: sans-serif; font-weight: bold;">Tutup</button>
        <button onclick="window.print()" style="padding: 10px 20px; border-radius: 8px; border: none; background: #1e40af; color: white; cursor: pointer; font-family: sans-serif; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Cetak PDF / Print</button>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://amhsvcovijbpwnezhomk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtaHN2Y292aWpicHduZXpob21rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTE3MDcsImV4cCI6MjA5NDE4NzcwN30.mCRj6k0vduUbIqEjG9NgttYyNp5gLQf4-1lD5GZbcsY'; // Must match index.html
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Utility safely getting values
        const val = (v) => v ? v : '-';

        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            const idsParam = urlParams.get('ids');

            if (!idParam && !idsParam) {
                alert('ID Siswa tidak ditemukan.');
                window.close();
                return;
            }

            const studentIds = idParam ? [idParam] : idsParam.split(',');

            try {
                const { data: students, error } = await supabaseClient
                    .from('buku_induk')
                    .select('*')
                    .in('id', studentIds);

                if (error) throw error;
                if (!students || students.length === 0) throw new Error("Data tidak ditemukan");

                const mainContainer = document.getElementById('main-container');
                const today = new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'long', year:'numeric'});

                students.forEach(data => {
                    let dob = '-';
                    if(data.tanggal_lahir) {
                        const d = new Date(data.tanggal_lahir);
                        dob = `${val(data.tempat_lahir)}, ${d.toLocaleDateString('id-ID', {day:'2-digit', month:'long', year:'numeric'})}`;
                    }

                    let kelasTahun = [];
                    if(data.kelas_sekarang) kelasTahun.push(`Kelas ${data.kelas_sekarang}`);
                    if(data.tahun_masuk) kelasTahun.push(`Tahun Ajaran ${data.tahun_masuk}`);
                    const diterimaInfo = kelasTahun.length > 0 ? kelasTahun.join(' / ') : '-';

                    const studentHtml = `
                        <div class="a4-container">
                            <div class="header">
                                <div class="header-logo">
                                    <img src="logo_thhk.png" alt="Logo THHK">
                                </div>
                                <div class="header-text">
                                    <h1>YAYASAN TRI DHARMA TEGAL</h1>
                                    <h2>SMP TUNAS HIDUP HARAPAN KITA</h2>
                                    <h3>( SEKOLAH RAMAH ANAK, TERAKREDITASI "B" )</h3>
                                    <p>Alamat: Jalan Gurami Nomor 6 Telepon (0283) 6146846 Kota Tegal</p>
                                    <p>Surel : smpthhk.tegal@gmail.com</p>
                                </div>
                            </div>

                            <div class="title">LEMBAR BUKU INDUK SISWA</div>

                            <div class="top-section">
                                <table class="table-data" style="width: 75%;">
                                    <tr><td class="label">Nomor Induk Siswa (NIS)</td><td class="colon">:</td><td class="value">${val(data.nis)}</td></tr>
                                    <tr><td class="label">Nomor Induk Siswa Nasional</td><td class="colon">:</td><td class="value">${val(data.nisn)}</td></tr>
                                </table>
                                <div class="photo-box">
                                    ${data.foto_url ? `<img src="${data.foto_url}" style="display:block">` : '<span>Pas Foto<br>3x4</span>'}
                                </div>
                            </div>

                            <div class="section-title">A. KETERANGAN PRIBADI SISWA</div>
                            <table class="table-data">
                                <tr><td class="label">1. Nama Lengkap</td><td class="colon">:</td><td class="value">${val(data.nama_lengkap)}</td></tr>
                                <tr><td class="label">2. Jenis Kelamin</td><td class="colon">:</td><td class="value">${val(data.jenis_kelamin)}</td></tr>
                                <tr><td class="label">3. Tempat, Tanggal Lahir</td><td class="colon">:</td><td class="value">${dob}</td></tr>
                                <tr><td class="label">4. Agama</td><td class="colon">:</td><td class="value">${val(data.agama)}</td></tr>
                                <tr><td class="label">5. Kewarganegaraan</td><td class="colon">:</td><td class="value">${val(data.kewarganegaraan)}</td></tr>
                                <tr><td class="label">6. Anak ke / Jumlah Saudara</td><td class="colon">:</td><td class="value">${data.anak_ke ? 'Anak ke-'+data.anak_ke : '-'}${data.jumlah_saudara !== null ? ' dari '+data.jumlah_saudara+' bersaudara' : ''}</td></tr>
                                <tr><td class="label">7. Alamat Lengkap</td><td class="colon">:</td><td class="value">${val(data.alamat_lengkap)}</td></tr>
                                <tr><td class="label">8. No. Telepon / HP Siswa</td><td class="colon">:</td><td class="value">${val(data.no_telp_siswa)}</td></tr>
                            </table>

                            <div class="section-title">B. KETERANGAN PENDIDIKAN</div>
                            <table class="table-data">
                                <tr><td class="label">1. Asal Sekolah Dasar (SD)</td><td class="colon">:</td><td class="value">${val(data.asal_sekolah)}</td></tr>
                                <tr><td class="label">2. Diterima di Sekolah Ini</td><td class="colon">:</td><td class="value">${diterimaInfo}</td></tr>
                                <tr><td class="label">3. Status Siswa Saat Ini</td><td class="colon">:</td><td class="value">${val(data.status_siswa)}</td></tr>
                            </table>

                            <div class="section-title">C. KETERANGAN ORANG TUA / WALI</div>
                            <table class="table-data">
                                <tr><td class="label">1. Nama Ayah Kandung</td><td class="colon">:</td><td class="value">${val(data.nama_ayah)}</td></tr>
                                <tr><td class="label">2. Pekerjaan Ayah</td><td class="colon">:</td><td class="value">${val(data.pekerjaan_ayah)}</td></tr>
                                <tr><td class="label">3. Nama Ibu Kandung</td><td class="colon">:</td><td class="value">${val(data.nama_ibu)}</td></tr>
                                <tr><td class="label">4. Pekerjaan Ibu</td><td class="colon">:</td><td class="value">${val(data.pekerjaan_ibu)}</td></tr>
                                <tr><td class="label">5. No. Telepon / HP Orang Tua</td><td class="colon">:</td><td class="value">${val(data.no_telp_ortu)}</td></tr>
                                <tr><td class="label">6. Nama Wali (Jika Ada)</td><td class="colon">:</td><td class="value">${val(data.nama_wali)}</td></tr>
                                <tr><td class="label">7. Pekerjaan Wali</td><td class="colon">:</td><td class="value">${val(data.pekerjaan_wali)}</td></tr>
                            </table>

                            <div class="signatures">
                                <div class="sign-box"><p>Orang Tua / Wali,</p><div class="sign-space"></div><p>_______________________</p></div>
                                <div class="sign-box"><p>Tegal, ${today}</p><p>Kepala Sekolah,</p><div class="sign-space"></div><p>_______________________</p><p style="font-size: 9pt; margin-top:0;">NIP. .........................</p></div>
                            </div>
                        </div>
                    `;
                    mainContainer.innerHTML += studentHtml;
                });

                document.getElementById('loading').style.display = 'none';

                setTimeout(() => {
                    window.print();
                }, 800);

            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat memuat data: ' + err.message);
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
